name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 zip unzip openjdk-17-jdk signapk libssl-dev libffi-dev p4a-build-deps autoconf libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Python Tools
        run: |
          pip install --upgrade pip setuptools virtualenv
          pip install buildozer cython==0.29.33 kivy

      - name: Initialize and Configure Buildozer
        run: |
          buildozer init
          # App Details Configuration
          sed -i 's/title = My Application/title = Wingo Predictor/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = wingopredictor/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.wingo/g' buildozer.spec
          # Requirements Configuration
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec
          # Accept Android SDK Licenses automatically
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WingoPredictor-APK
          path: bin/*.apk
