name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev python3-pip python3-setuptools python3-virtualenv unzip zip zlib1g-dev openjdk-17-jdk signapk p4a-build-deps autoconf libtool pkg-config

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer kivy

      - name: Configure Buildozer Specification
        run: |
          buildozer init
          # Automatically accept android sdk licenses during compile
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          # Set proper app title and packages
          sed -i 's/title = My Application/title = Wingo Predictor/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = wingopredictor/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.wingo/g' buildozer.spec

      - name: Compile Code to Android APK
        run: |
          buildozer -v android debug

      - name: Export Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WingoPredictor-APK
          path: bin/*.apk
