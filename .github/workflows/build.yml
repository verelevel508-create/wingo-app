name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y --no-install-recommends build-essential ccache git libffi-dev libssl-dev python3-dev python3-setuptools python3-virtualenv unzip zip zlib1g-dev autoconf libtool pkg-config patch

      - name: Install Python Tools via Pip
        run: |
          pip install --upgrade pip setuptools virtualenv
          pip install cython==0.29.33 buildozer

      - name: Create Custom Buildozer Configuration
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Wingo Predictor
          package.name = wingopredictor
          package.domain = org.wingo
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          # FIXED: Removed raw sdl2 packages to prevent pip download crash
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 1
          android.api = 33
          android.minapi = 21
          android.ndk_api = 21
          android.private_storage = True
          android.accept_sdk_license = True
          android.archs = armeabi-v7a, arm64-v8a
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WingoPredictor-APK
          path: bin/*.apk
